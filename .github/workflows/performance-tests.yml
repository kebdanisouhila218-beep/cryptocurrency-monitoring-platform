name: Performance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  actions: read

jobs:
  locust-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r api/requirements.txt
        pip install locust
        pip install -r tests/performance/requirements.txt || true
    
    - name: Start API
      run: |
        cd api
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run Locust tests
      run: |
        locust -f tests/performance/locustfile_web.py \
          --host=http://localhost:8000 \
          --users 5 \
          --spawn-rate 1 \
          --run-time 30s \
          --headless \
          --html results/locust_report.html \
          --csv results/locust_stats.csv || echo "Locust tests completed"
    
    - name: Upload Locust results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: locust-results
        path: results/
    
    - name: Performance thresholds
      run: |
        if [ -f results/locust_stats.csv_stats.csv ]; then
          python -c "
        import csv
        import os
        stats_file = 'results/locust_stats.csv_stats.csv'
        if os.path.exists(stats_file):
            with open(stats_file, 'r') as f:
                reader = csv.DictReader(f)
                for row in reader:
                    if row.get('Type') == 'Aggregated':
                        avg_response = float(row.get('Average response time', 0))
                        print(f'Average response time: {avg_response}ms')
        else:
            print('Stats file not found')
          "
        else
          echo "Locust stats file not found, skipping threshold check"
        fi

  k6-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6 || echo "k6 installation failed, skipping k6 tests"
    
    - name: Install API dependencies
      run: |
        pip install -r api/requirements.txt
    
    - name: Start API
      run: |
        cd api
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Create results directory
      run: mkdir -p results
      
    - name: Run k6 tests
      run: |
        k6 run tests/performance/k6_load_test.js \
          --out json=results/k6_results.json \
          --summary-export=results/k6_summary.json || echo "k6 tests completed"
    
    - name: Upload k6 results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-results
        path: results/
    
    - name: Check k6 thresholds
      run: |
        if [ -f results/k6_summary.json ]; then
          echo "k6 results found, checking thresholds..."
          cat results/k6_summary.json | head -50
        else
          echo "k6 results file not found, skipping threshold check"
        fi

  performance-report:
    runs-on: ubuntu-latest
    needs: [locust-tests, k6-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: results/
    
    - name: Generate performance report
      run: |
        echo "# Performance Test Report" > results/performance_report.md
        echo "Generated on: $(date)" >> results/performance_report.md
        echo "" >> results/performance_report.md
        echo "## Locust Results" >> results/performance_report.md
        if [ -f results/locust_report.html ]; then
          echo "✅ Locust tests completed" >> results/performance_report.md
        else
          echo "❌ Locust tests failed" >> results/performance_report.md
        fi
        echo "" >> results/performance_report.md
        echo "## k6 Results" >> results/performance_report.md
        if [ -f results/k6_summary.json ]; then
          echo "✅ k6 tests completed" >> results/performance_report.md
        else
          echo "❌ k6 tests failed" >> results/performance_report.md
        fi
    
    - name: Upload performance report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: results/performance_report.md
