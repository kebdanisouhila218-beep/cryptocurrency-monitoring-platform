name: Performance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  locust-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r api/requirements.txt
        pip install locust
        pip install -r tests/performance/requirements.txt
    
    - name: Start API
      run: |
        cd api
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Run Locust tests
      run: |
        locust -f tests/performance/locustfile.py \
          --host=http://localhost:8000 \
          --users 10 \
          --spawn-rate 2 \
          --run-time 60s \
          --headless \
          --html results/locust_report.html \
          --csv results/locust_stats
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Upload Locust results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: locust-results
        path: results/
    
    - name: Performance thresholds
      run: |
        python -c "
        import csv
        with open('results/locust_stats_requests.csv', 'r') as f:
            reader = csv.DictReader(f)
            for row in reader:
                if row['Type'] == 'Aggregated':
                    avg_response = float(row['Average response time'])
                    if avg_response > 500:
                        print(f'❌ Average response time too high: {avg_response}ms')
                        exit(1)
                    else:
                        print(f'✅ Average response time OK: {avg_response}ms')
        "

  k6-tests:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install k6
      run: |
        sudo gpg -k /etc/apt/keyrings/gpg --no-default-keyring --import --keyring /etc/apt/keyrings/k6-archive-keyring.gpg https://dl.k6.io/key/gpg
        echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
    
    - name: Install API dependencies
      run: |
        pip install -r api/requirements.txt
    
    - name: Start API
      run: |
        cd api
        uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
    
    - name: Create results directory
      run: mkdir -p results
      
    - name: Run k6 tests
      run: |
        k6 run tests/performance/k6_load_test.js \
          --out json=results/k6_results.json \
          --summary-export=results/k6_summary.json
    
    - name: Upload k6 results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-results
        path: results/
    
    - name: Check k6 thresholds
      run: |
        python -c "
        import json
        with open('results/k6_summary.json', 'r') as f:
            data = json.load(f)
            metrics = data['metrics']
            
            # Check response time thresholds
            p95 = metrics['http_req_duration']['values']['p(95)']
            if p95 > 500:
                print(f'❌ P95 response time too high: {p95}ms')
                exit(1)
            else:
                print(f'✅ P95 response time OK: {p95}ms')
            
            # Check error rate
            error_rate = metrics['http_req_failed']['values']['rate']
            if error_rate > 0.05:
                print(f'❌ Error rate too high: {error_rate*100:.2f}%')
                exit(1)
            else:
                print(f'✅ Error rate OK: {error_rate*100:.2f}%')
        "

  performance-report:
    runs-on: ubuntu-latest
    needs: [locust-tests, k6-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: results/
    
    - name: Generate performance report
      run: |
        echo "# Performance Test Report" > results/performance_report.md
        echo "Generated on: $(date)" >> results/performance_report.md
        echo "" >> results/performance_report.md
        echo "## Locust Results" >> results/performance_report.md
        if [ -f results/locust_report.html ]; then
          echo "✅ Locust tests completed" >> results/performance_report.md
        else
          echo "❌ Locust tests failed" >> results/performance_report.md
        fi
        echo "" >> results/performance_report.md
        echo "## k6 Results" >> results/performance_report.md
        if [ -f results/k6_summary.json ]; then
          echo "✅ k6 tests completed" >> results/performance_report.md
        else
          echo "❌ k6 tests failed" >> results/performance_report.md
        fi
    
    - name: Upload performance report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: results/performance_report.md
