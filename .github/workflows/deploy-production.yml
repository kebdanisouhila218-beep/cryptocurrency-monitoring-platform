# .github/workflows/deploy-production.yml
name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crypto-platform

jobs:
  deploy-production:
    name: Deploy to Production (Simulated)
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=main-$(echo ${{ github.sha }} | cut -c1-7)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Production Deployment Summary
        run: |
          echo "🚀 Production Deployment"
          echo "========================"
          echo ""
          echo "Version: ${{ steps.version.outputs.version }}"
          echo ""
          echo "✅ Images available in GHCR:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:latest"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest"
          echo ""
          echo "📝 To deploy manually:"
          echo "  docker-compose pull"
          echo "  docker-compose up -d"
          echo ""
          echo "✅ Production deployment simulated successfully!"
