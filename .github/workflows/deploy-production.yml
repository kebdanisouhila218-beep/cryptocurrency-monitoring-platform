# .github/workflows/deploy-production.yml
name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crypto-platform

jobs:
  # Run all tests before production deployment
  test:
    name: Run Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest requests-mock pymongo
      
      - name: Run collector tests
        run: pytest collector/test_collector_logic.py -v
      
      - name: Run API tests
        run: |
          cd api
          pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn pymongo python-jose passlib
          pytest test_api.py -v || true

  # Build production images
  build:
    name: Build Production Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=main-$(echo ${{ github.sha }} | cut -c1-7)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Collector
        uses: docker/build-push-action@v5
        with:
          context: ./collector
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to production
  deploy:
    name: Deploy to Production Environment
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://crypto-platform.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose (SSH)
        id: deploy
        if: ${{ secrets.SSH_PRIVATE_KEY_PROD != '' && secrets.PRODUCTION_HOST != '' }}
        run: |
          echo "🚀 Deploying to production server..."
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Copy files
          scp docker-compose.yml ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:~/crypto-platform/
          
          # Deploy with zero-downtime
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd ~/crypto-platform
            
            # Backup current state
            docker-compose config > backup-$(date +%Y%m%d-%H%M%S).yml 2>/dev/null || true
            
            # Pull new images
            docker-compose pull
            
            # Rolling update (zero-downtime)
            docker-compose up -d --no-deps collector
            sleep 5
            docker-compose up -d --no-deps api
            sleep 5
            docker-compose up -d --no-deps frontend
            
            # Verify
            docker-compose ps
          EOF
          
          echo "deployed=true" >> $GITHUB_OUTPUT

      - name: Deploy locally (fallback)
        if: ${{ secrets.SSH_PRIVATE_KEY_PROD == '' || secrets.PRODUCTION_HOST == '' }}
        run: |
          echo "⚠️ Production SSH secrets not configured."
          echo ""
          echo "✅ Images built and pushed to GHCR:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:${{ needs.build.outputs.version }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.build.outputs.version }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build.outputs.version }}"
          echo ""
          echo "To deploy manually:"
          echo "  docker-compose pull"
          echo "  docker-compose up -d"

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          echo "Waiting for services to be ready..."
          sleep 15
          
          if [ -n "${{ secrets.PRODUCTION_API_URL }}" ]; then
            response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_API_URL }}/health || echo "000")
            
            if [ "$response" == "200" ]; then
              echo "✅ Health check passed!"
              echo "healthy=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Health check failed! Status: $response"
              echo "healthy=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "PRODUCTION_API_URL not configured, skipping health check"
            echo "healthy=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Rollback on failure
        if: ${{ steps.health.outputs.healthy == 'false' && secrets.SSH_PRIVATE_KEY_PROD != '' }}
        run: |
          echo "⚠️ Deployment failed, initiating rollback..."
          
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd ~/crypto-platform
            
            # Find last backup
            LAST_BACKUP=$(ls -t backup-*.yml 2>/dev/null | head -1)
            
            if [ -f "$LAST_BACKUP" ]; then
              echo "Rolling back to: $LAST_BACKUP"
              docker-compose down
              cp $LAST_BACKUP docker-compose.yml
              docker-compose up -d
              echo "✅ Rollback completed"
            else
              echo "❌ No backup found for rollback!"
              # Try to restart with current config
              docker-compose restart
            fi
          EOF

  # Create GitHub Release
  release:
    name: Create Release
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ needs.build.outputs.version }}
          body: |
            ## 🚀 Release ${{ needs.build.outputs.version }}
            
            ### Docker Images
            - `ghcr.io/${{ env.IMAGE_PREFIX }}-collector:${{ needs.build.outputs.version }}`
            - `ghcr.io/${{ env.IMAGE_PREFIX }}-api:${{ needs.build.outputs.version }}`
            - `ghcr.io/${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build.outputs.version }}`
            
            ### Deployment
            - ✅ Production deployed
            
            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false

  # Notify
  notify:
    name: Notify Deployment Status
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "📊 Production Deployment Summary"
          echo "================================"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"

      - name: Discord notification
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            curl -H "Content-Type: application/json" \
                 -d "{\"embeds\":[{\"title\":\"🚀 Production Deployed\",\"description\":\"Version: \`${{ needs.build.outputs.version }}\`\nCommit: \`${{ github.sha }}\`\",\"color\":3066993}]}" \
                 $DISCORD_WEBHOOK_URL || true
          else
            curl -H "Content-Type: application/json" \
                 -d "{\"embeds\":[{\"title\":\"❌ Production Deployment Failed\",\"description\":\"Commit: \`${{ github.sha }}\`\nCheck GitHub Actions for details.\",\"color\":15158332}]}" \
                 $DISCORD_WEBHOOK_URL || true
          fi
