# collector test

name: Tests

on: [push, pull_request]

jobs:
  test-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest requests-mock

      - name: Run collector unit tests
        id: tests
        continue-on-error: true
        run: |
          cd collector
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest test_collector_logic.py -v --tb=short

      - name: Test Summary
        run: |
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo " All collector tests passed!"
          else
            echo " Some tests failed. Check the logs above."
            exit 1
          fi