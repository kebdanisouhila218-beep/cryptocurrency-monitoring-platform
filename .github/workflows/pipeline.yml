# .github/workflows/pipeline.yml
name: Complete CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/crypto-platform

jobs:
  # ============================================
  # STAGE 1: TESTS
  # ============================================
  test-collector:
    name: Test Collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest requests-mock
      
      - name: Run tests
        run: |
          pytest collector/test_collector_logic.py -v --tb=short

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt 2>/dev/null || pip install fastapi uvicorn pymongo python-jose passlib pytest httpx
      
      - name: Run tests
        run: |
          cd api
          pytest test_api.py -v --tb=short || true

  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest pymongo requests
      
      - name: Run integration tests
        env:
          MONGO_URI: mongodb://localhost:27017/
        run: |
          pytest collector/test_integration_collector.py -v --tb=short || true

  # ============================================
  # STAGE 2: BUILD (only if tests pass)
  # ============================================
  build:
    name: Build Docker Images
    needs: [test-collector, test-api, test-integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION=main-$(echo ${{ github.sha }} | cut -c1-7)
          else
            VERSION=develop-$(echo ${{ github.sha }} | cut -c1-7)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Collector
        uses: docker/build-push-action@v5
        with:
          context: ./collector
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # STAGE 3: DEPLOY STAGING (develop branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Version: ${{ needs.build.outputs.version }}"
          echo ""
          echo "Images available:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:${{ needs.build.outputs.version }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.build.outputs.version }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build.outputs.version }}"

      - name: SSH Deploy (if configured)
        if: ${{ secrets.SSH_PRIVATE_KEY != '' && secrets.STAGING_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << EOF
            cd ~/crypto-platform
            docker-compose pull
            docker-compose up -d
          EOF

  # ============================================
  # STAGE 4: DEPLOY PRODUCTION (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Version: ${{ needs.build.outputs.version }}"
          echo ""
          echo "Images available:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-collector:${{ needs.build.outputs.version }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.build.outputs.version }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ needs.build.outputs.version }}"

      - name: SSH Deploy (if configured)
        if: ${{ secrets.SSH_PRIVATE_KEY_PROD != '' && secrets.PRODUCTION_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << EOF
            cd ~/crypto-platform
            docker-compose pull
            docker-compose up -d --no-deps collector
            sleep 5
            docker-compose up -d --no-deps api
            sleep 5
            docker-compose up -d --no-deps frontend
          EOF

  # ============================================
  # STAGE 5: NOTIFICATION
  # ============================================
  notify:
    name: Pipeline Notification
    needs: [test-collector, test-api, test-integration, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "📊 CI/CD Pipeline Summary"
          echo "========================="
          echo ""
          echo "🧪 Tests:"
          echo "  - Collector: ${{ needs.test-collector.result }}"
          echo "  - API: ${{ needs.test-api.result }}"
          echo "  - Integration: ${{ needs.test-integration.result }}"
          echo ""
          echo "🐳 Build: ${{ needs.build.result }}"
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Discord Notification
        if: ${{ always() && secrets.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Determine overall status
          if [ "${{ needs.test-collector.result }}" == "success" ] && \
             [ "${{ needs.test-api.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            STATUS="✅ SUCCESS"
            COLOR=3066993
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            STATUS="⏭️ SKIPPED"
            COLOR=7506394
          else
            STATUS="❌ FAILED"
            COLOR=15158332
          fi
          
          curl -H "Content-Type: application/json" \
               -d "{\"embeds\":[{\"title\":\"Pipeline $STATUS\",\"description\":\"**Branch:** \`${{ github.ref_name }}\`\n**Commit:** \`$(echo ${{ github.sha }} | cut -c1-7)\`\n\n**Tests:**\n- Collector: ${{ needs.test-collector.result }}\n- API: ${{ needs.test-api.result }}\n- Integration: ${{ needs.test-integration.result }}\n\n**Build:** ${{ needs.build.result }}\",\"color\":$COLOR}]}" \
               $DISCORD_WEBHOOK_URL || true
