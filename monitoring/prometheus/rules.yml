# Prometheus Alerting Rules
groups:
  - name: crypto-platform.rules
    rules:
      # API Health Alerts
      - alert: APIDown
        expr: up{job="fastapi"} == 0
        for: 1m
        labels:
          severity: critical
          service: crypto-api
        annotations:
          summary: "Crypto API is down"
          description: "Crypto API has been down for more than 1 minute"

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="fastapi"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: crypto-api
        annotations:
          summary: "API high latency detected"
          description: "95th percentile latency is above 1 second for 2 minutes"

      - alert: APIHighErrorRate
        expr: rate(http_requests_total{job="fastapi",status_code=~"5.."}[5m]) / rate(http_requests_total{job="fastapi"}[5m]) > 0.05
        for: 1m
        labels:
          severity: warning
          service: crypto-api
        annotations:
          summary: "High error rate on API"
          description: "Error rate is above 5% for 1 minute"

      # Database Alerts
      - alert: MongoDBDown
        expr: up{job="mongodb"} == 0
        for: 30s
        labels:
          severity: critical
          service: mongodb
        annotations:
          summary: "MongoDB is down"
          description: "MongoDB has been down for more than 30 seconds"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 30 seconds"

      # System Resource Alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for 5 minutes"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for 5 minutes"

      # Crypto-Specific Alerts
      - alert: NoRecentPriceData
        expr: time() - crypto_prices_collected_total > 300
        for: 2m
        labels:
          severity: warning
          service: data-collection
        annotations:
          summary: "No recent price data collected"
          description: "No price data has been collected for more than 5 minutes"

      - alert: TooManyFailedLogins
        expr: rate(failed_login_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "High rate of failed logins"
          description: "Failed login rate is above 10 per minute"
