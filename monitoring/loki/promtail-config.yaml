server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: crypto-api-logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: crypto-api
      __path__: /var/log/crypto-api/*.log
  pipeline_stages:
  - json:
      expressions:
        level: level
        message: message
        timestamp: timestamp
        service: service
  - timestamp:
      format: RFC3339
      source: timestamp
  - labels:
      service: service
  - output:
      source: output

- job_name: crypto-collector-logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: crypto-collector
      __path__: /var/log/crypto-collector/*.log
  pipeline_stages:
  - json:
      expressions:
        level: level
        message: message
        timestamp: timestamp
  - timestamp:
      format: RFC3339
      source: timestamp
  - output:
      source: output

- job_name: docker-logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: docker
      __path__: /var/lib/docker/containers/*/*log
  pipeline_stages:
  - json:
      expressions:
        stream: stream
        attrs: attrs
  - regex:
      expression: (?P<container_name>(?:[^|]*_)(?P<container_name>[^|]+)\.log)
      source: attrs
  - timestamp:
      format: RFC3339
      source: time
  - labels:
      container: container_name
      stream: stream
  - output:
      source: output
