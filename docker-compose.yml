version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  collector-test:
    build: ./collector
    container_name: collector-test
    depends_on:
      - mongo
    command: ["python", "collector.py", "test"]

  api:
    build: ./api
    container_name: fastapi
    ports:
      - "8001:8000"
    volumes:
      - ./api:/app
    depends_on:
      - mongo
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Note: Docker expose sur 8001 externe, 8000 interne
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_URI=mongodb://mongo:27017/
      - ALERT_CHECKER_ENABLED=true
      - ALERT_CHECK_INTERVAL_SECONDS=60
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=kebdanisouhila218@gmail.com
      - SMTP_PASSWORD=qawaplnbkdxivgtw
      - SMTP_FROM_EMAIL=kebdanisouhila218@gmail.com
      - SMTP_FROM_NAME=Crypto Monitoring
      - EMAIL_DEBUG_MODE=false
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}

  test-unit-api:
    image: python:3.11-slim
    container_name: test-unit-api
    volumes:
      - ./api:/app
    working_dir: /app
    command: >
      sh -c "
        pip install pytest fastapi httpx pymongo &&
        python -m pytest test_api.py -v
      "
  scheduler:
    build: ./collector
    container_name: scheduler
    command: celery -A tasks beat --loglevel=info
    depends_on:
      - mongo
      - redis

  worker:
    build: ./collector
    container_name: worker
    command: celery -A tasks worker --loglevel=info
    depends_on:
      - mongo
      - redis

  test-integration:
    image: python:3.11-slim
    container_name: test-integration
    volumes:
      - ./collector:/app
    working_dir: /app
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    command: >
      sh -c "
        apt-get update && apt-get install -y curl &&
        pip install pytest pymongo requests &&
        # Attendre que MongoDB soit prêt
        until curl -f http://mongo:27017/ 2>/dev/null; do
          echo ' En attente de MongoDB...' && sleep 2;
        done &&
        echo ' MongoDB prêt. Lancement des tests...' &&
        python -m pytest test_integration_collector.py -v
      "
  ci-test-collector:
    build: ./collector
    volumes:
      - ./collector:/app
    working_dir: /app
    depends_on:
      - mongo
    command: >
      sh -c "
        pip install pytest pymongo requests &&
        until timeout 1 curl -f http://mongo:27017/ 2>/dev/null; do sleep 1; done &&
        python -m pytest test_integration_collector.py -v
      "
  test-integration-api:
    image: python:3.11-slim
    volumes:
      - ./api:/app
    working_dir: /app
    depends_on:
      - mongo
    command: >
      sh -c "
        pip install pytest httpx pymongo &&
        until timeout 1 curl -f http://mongo:27017/ 2>/dev/null; do sleep 1; done &&
        python -m pytest test_integration_api.py -v
      "
  # ===== MONITORING =====
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

  # MongoDB Exporter pour Prometheus
  mongodb-exporter:
    image: percona/mongodb_exporter:0.39
    container_name: mongodb-exporter
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  # Redis Exporter pour Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # Node Exporter pour métriques système
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  # ===== ANALYSE QUALITÉ =====
  sonarqube:
    image: sonarqube:10.3-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: