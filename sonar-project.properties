# SonarQube Configuration for CryptoTracker

# Project identification
sonar.projectKey=cryptocurrency-monitoring-platform
sonar.projectName=CryptoTracker - Cryptocurrency Monitoring Platform
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=api,frontend/src,collector

# Exclusions
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/venv/**,**/*.test.js,**/*.spec.js,**/test_*.py,**/*.min.js,**/build/**,**/dist/**

# Test files
sonar.tests=api,frontend/src,collector
sonar.test.inclusions=**/test_*.py,**/*.test.js,**/*.spec.js

# Python specific
sonar.python.version=3.11

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage exclusions
sonar.coverage.exclusions=**/test_*.py,**/*.test.js,**/*.spec.js,**/node_modules/**
